# 평소 개발은 db만 띄운다: docker compose up -d db
# 배포와 같은 컨테이너로 확인할 때: docker compose up -d backend (db도 함께 뜬다)
#   마이그레이션은 자동 실행하지 않는다: docker compose run --rm backend alembic upgrade head
# 화면까지 배포와 같은 컨테이너로 확인할 때: docker compose up -d frontend (backend, db도 함께 뜬다)
services:
  db:
    image: postgres:18
    # env_file로 .env 전체를 넘기면 OpenRouter Key 같은 비밀값까지 컨테이너에 들어가므로 DB 변수만 넘긴다.
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER를 .env에 설정하세요}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD를 .env에 설정하세요}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB를 .env에 설정하세요}
    ports:
      # 개발 DB가 같은 네트워크의 다른 PC에 열리지 않도록 로컬에만 연다.
      - "127.0.0.1:5432:5432"
    volumes:
      # 볼륨이 비어 있을 때만 실행된다. 테이블은 Alembic이 만들므로 여기에는 patron_test 생성만 둔다.
      - ./db/init:/docker-entrypoint-initdb.d:ro
      # PostgreSQL 18부터 데이터 볼륨은 /var/lib/postgresql에 마운트한다(16까지의 .../data 아님).
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    profiles:
      - full
    
    build: ./backend
    
    # db와 같은 이유로 .env 전체를 넘기지 않는다. OPENROUTER_API_KEY가 없으면 시뮬레이션 접수만 거절되고 앱은 뜬다.
    environment:
      # PostgreSQL 연결
      DATABASE_URL: "postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}"
      
      # 애플리케이션 환경
      APP_ENV: ${APP_ENV:-development}
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN:-http://localhost:5173}
      SESSION_COOKIE_SECURE: "false"

      # 로컬 이미지 업로드 기능 
      UPLOAD_DIR: /app/uploads
    
    volumes:
      - ./backend/uploads:/app/uploads
      
    ports:
      - "127.0.0.1:8000:8080"
    
    depends_on:
      db:
        condition: service_healthy

  frontend:
    profiles:
      - full

    build: ./frontend

    # .env 전체를 넘기지 않는다. nginx가 /api/*를 compose 네트워크의 backend로 넘기도록 주소만 준다.
    environment:
      BACKEND_URL: http://backend:8080
      BACKEND_HOST: backend

    ports:
      # Vite 개발 서버와 동일한 호스트 포트(5173)을 사용하므로 동시 실행 불가
      # 브라우저의 /api 요청을 nginx를 통해 backend로 전달
      - "127.0.0.1:5173:8080"

    depends_on:
      - backend

volumes:
  pgdata:
